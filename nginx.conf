server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json;

    # Hashed assets - cache 1 year (immutable, Vite adds hash to filenames)
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Workbox scripts - cache 1 year (immutable)
    location ^~ /workbox- {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker - NEVER cache (critical for PWA updates)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Manifest - short cache
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # All other files - no cache, fallback to index.html for SPA routing
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri /index.html;
    }
}
