name: Build and Deploy Phone Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push to DOCR
    runs-on: ubuntu-latest
    environment: Prod

    env:
      DOCR_REGISTRY: ${{ secrets.DOCR_REGISTRY }}
      DOCR_REPOSITORY: ${{ secrets.DOCR_REPOSITORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCR_REGISTRY }}
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_TOKEN }}

      - name: Calculate Tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_BASE="${{ secrets.DOCR_REGISTRY }}/${{ secrets.DOCR_REPOSITORY }}/phone-scanner"
          TAGS="${IMAGE_BASE}:latest,${IMAGE_BASE}:prod,${IMAGE_BASE}:prod-${SHORT_SHA}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated Tags: ${TAGS}"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "Deploying Phone Scanner to Production..."
            cd /opt/app/quickprx

            # Login to Registry
            echo ${{ secrets.DOCR_TOKEN }} | docker login registry.digitalocean.com -u ${{ secrets.DOCR_USERNAME }} --password-stdin

            # Pull latest phone-scanner image
            docker compose -f docker-compose.prod.yml pull phone-scanner

            # Restart phone-scanner service
            docker compose -f docker-compose.prod.yml up -d phone-scanner

            # Clean up old images
            docker image prune -f

            echo "Phone Scanner Deployment Complete."
