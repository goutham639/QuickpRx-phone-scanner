name: Build and Deploy Phone Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    name: Build and Push to Registry
    runs-on: ubuntu-24.04-arm
    environment: Prod

    env:
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calculate Tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_BASE="${{ secrets.ECR_REGISTRY }}/quickprx/phone-scanner"

          BUILD_ARGS=""
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${IMAGE_BASE}:latest,${IMAGE_BASE}:prod,${IMAGE_BASE}:prod-${SHORT_SHA}"
            BUILD_ARGS="VITE_API_BASE_URL=https://api.quickprx.com"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${IMAGE_BASE}:dev,${IMAGE_BASE}:dev-${SHORT_SHA}"
            BUILD_ARGS="VITE_API_BASE_URL=https://api-test.quickprx.ca"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          {
            echo "build_args<<EOF"
            echo "${BUILD_ARGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Generated Tags: ${TAGS}"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ steps.meta.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Prod
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "Deploying Phone Scanner to Production..."
            cd /opt/app/quickprx

            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker compose -f docker-compose.prod.yml pull phone-scanner
            docker compose -f docker-compose.prod.yml up -d phone-scanner
            docker image prune -f

            echo "Phone Scanner Deployment Complete."
